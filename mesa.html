<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mi pedido</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #f4f5f7;
–surface: #ffffff;
–surface2: #f0f1f3;
–border: #e0e2e8;
–accent: #E8411A;
–green: #1DA760;
–yellow: #F5A623;
–red: #E8411A;
–text: #1a1a2e;
–muted: #6b7280;
–dim: #c0c4cc;
–font: Inter, system-ui, -apple-system, sans-serif;
–mono: ui-monospace, “SF Mono”, Consolas, monospace;
–radius: 12px;
}

body {
background: var(–bg);
color: var(–text);
font-family: var(–font);
min-height: 100vh;
font-size: 15px;
}

/* HEADER */
.header {
background: var(–surface);
border-bottom: 3px solid var(–accent);
padding: 1rem 1.25rem;
display: flex;
align-items: center;
justify-content: space-between;
position: sticky;
top: 0;
z-index: 10;
}

.header-left { display: flex; flex-direction: column; gap: 2px; }

.header-brand {
font-size: 11px;
font-weight: 600;
color: var(–accent);
text-transform: uppercase;
letter-spacing: 1px;
}

.header-mesa {
font-size: 20px;
font-weight: 700;
color: var(–text);
}

.header-status {
font-size: 11px;
padding: 4px 10px;
border-radius: 20px;
font-weight: 600;
}

.status-activo   { background: #e6f7ef; color: #0e6e3a; }
.status-vacio    { background: #fff8e6; color: #b87a00; }
.status-loading  { background: #f0f1f3; color: var(–muted); }

/* MAIN */
.main { padding: 1.25rem; max-width: 520px; margin: 0 auto; }

/* PEDIDO CARD */
.pedido-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
overflow: hidden;
margin-bottom: 1rem;
}

.pedido-header {
padding: 1rem 1.25rem;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
}

.pedido-num {
font-size: 13px;
font-weight: 600;
color: var(–text);
}

.pedido-fecha {
font-size: 12px;
color: var(–muted);
}

/* LINE ITEMS */
.line-item {
display: flex;
align-items: center;
padding: 0.9rem 1.25rem;
border-bottom: 1px solid var(–border);
gap: 1rem;
}

.line-item:last-child { border-bottom: none; }

.line-qty {
min-width: 36px;
height: 36px;
background: var(–surface2);
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
font-size: 14px;
font-weight: 700;
color: var(–accent);
font-family: var(–mono);
}

.line-desc {
flex: 1;
}

.line-name {
font-size: 14px;
font-weight: 500;
color: var(–text);
line-height: 1.3;
}

.line-code {
font-size: 11px;
color: var(–muted);
font-family: var(–mono);
margin-top: 2px;
}

.line-price {
font-size: 14px;
font-weight: 600;
color: var(–text);
font-family: var(–mono);
white-space: nowrap;
}

/* TOTALS */
.totals {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: 1rem 1.25rem;
margin-bottom: 1rem;
}

.total-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 5px 0;
font-size: 14px;
color: var(–muted);
}

.total-row.grand {
border-top: 1px solid var(–border);
margin-top: 6px;
padding-top: 10px;
font-size: 18px;
font-weight: 700;
color: var(–text);
}

.total-row.grand span:last-child { color: var(–accent); }

/* ACTIONS */
.actions { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }

.btn-pay {
width: 100%;
padding: 15px;
border: none;
border-radius: var(–radius);
font-family: var(–font);
font-size: 15px;
font-weight: 600;
cursor: pointer;
transition: opacity 0.2s, transform 0.1s;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
}

.btn-pay:active { transform: scale(0.98); }
.btn-pay:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-switchpay {
background: var(–accent);
color: #fff;
}

.btn-mesero {
background: var(–surface);
color: var(–text);
border: 1.5px solid var(–border);
}

.btn-mesero:hover { border-color: var(–accent); }

/* EMPTY / LOADING / ERROR */
.state-box {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: 3rem 1.5rem;
text-align: center;
color: var(–muted);
}

.state-icon { font-size: 40px; margin-bottom: 0.75rem; }
.state-title { font-size: 16px; font-weight: 600; color: var(–text); margin-bottom: 0.5rem; }
.state-sub { font-size: 13px; color: var(–muted); line-height: 1.5; }

.spinner {
width: 28px; height: 28px;
border: 3px solid var(–dim);
border-top-color: var(–accent);
border-radius: 50%;
animation: spin 0.7s linear infinite;
margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* CONFIRM MODAL */
.modal-overlay {
position: fixed; inset: 0;
background: rgba(0,0,0,0.4);
z-index: 100;
display: flex;
align-items: flex-end;
justify-content: center;
padding: 1rem;
}

.modal {
background: var(–surface);
border-radius: 16px 16px 12px 12px;
width: 100%;
max-width: 480px;
padding: 1.5rem;
}

.modal-title {
font-size: 17px;
font-weight: 700;
color: var(–text);
margin-bottom: 0.5rem;
}

.modal-sub {
font-size: 13px;
color: var(–muted);
margin-bottom: 1.25rem;
line-height: 1.5;
}

.modal-btns { display: flex; flex-direction: column; gap: 0.5rem; }

/* SUCCESS */
.success-banner {
background: #e6f7ef;
border: 1px solid #a3d9bc;
border-radius: var(–radius);
padding: 1.25rem;
text-align: center;
margin-bottom: 1rem;
}

.success-icon { font-size: 36px; margin-bottom: 0.5rem; }
.success-title { font-size: 16px; font-weight: 700; color: #0e6e3a; margin-bottom: 0.25rem; }
.success-sub { font-size: 13px; color: #1DA760; }

/* REFRESH */
.refresh-btn {
background: none;
border: none;
color: var(–accent);
font-family: var(–font);
font-size: 13px;
font-weight: 500;
cursor: pointer;
padding: 4px 0;
text-decoration: underline;
}

/* QR PRINT SECTION (hidden on screen, shown when printing) */
@media print {
body * { visibility: hidden; }
#qr-section, #qr-section * { visibility: visible; }
#qr-section { position: fixed; top: 0; left: 0; width: 100%; }
}
</style>

</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-brand">Switch Connect</div>
    <div class="header-mesa" id="header-mesa">Cargando...</div>
  </div>
  <div class="header-status status-loading" id="header-status">•••</div>
</div>

<div class="main" id="main">
  <div class="state-box">
    <div class="spinner"></div>
    <div class="state-title">Buscando tu pedido...</div>
  </div>
</div>

<script>
const API_URL  = 'https://agrochef.switch-soft.com';
const API_USER = 'admin';   // ← usuario con permisos de solo lectura + cobranza
const API_PASS = 'Mamba2020';   // ← cambia esto

// Leer número de mesa desde ?mesa=1
const params  = new URLSearchParams(location.search);
const mesaNum    = params.get('mesa') || '1';
const mesaCodigo = mesaNum.padStart(3, '0');  // "1" → "001", "7" → "007"

let TOKEN = '';
let pedidoActual = null;

// ── INIT ──────────────────────────────────────────────────────
document.getElementById('header-mesa').textContent = 'Mesa ' + mesaNum;
document.title = 'Mesa ' + mesaNum + ' — Mi pedido';
init();

async function init() {
  try {
    await login();
    await cargarPedido();
  } catch(e) {
    mostrarError(e.message);
  }
}

async function login() {
  const fd = new FormData();
  fd.append('usuario', API_USER);
  fd.append('password', API_PASS);
  const r = await fetch(API_URL + '/autenticacion', { method: 'POST', body: fd });
  const data = await r.json();
  if (data.error) throw new Error('No se pudo conectar: ' + data.error.message);
  TOKEN = data.data.token;
}

async function apiGet(path) {
  const r = await fetch(API_URL + path, {
    headers: { 'Authorization': TOKEN }
  });
  const data = await r.json();
  if (data.error) {
    if (data.error.code == '0005' && data.new_token) TOKEN = data.new_token;
    else throw new Error(data.error.message);
  }
  return data.data;
}

function fmtMoney(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return '—';
  return '$' + n.toLocaleString('es-PA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── BUSCAR PEDIDO ─────────────────────────────────────────────
async function cargarPedido() {
  // Buscar cliente por código "001", "002", etc.
  const dc = await apiGet('/apicliente/lista?filtro=' + encodeURIComponent(mesaCodigo) + '&porPagina=10&paginaActual=1');
  const clientes = dc.clientes || [];
  const cliente = clientes.find(c => (c.codigo || '').trim() === mesaCodigo);

  if (!cliente) {
    mostrarVacio('Mesa no configurada', 'No encontramos el cliente con código "' + mesaCodigo + '" en el sistema.');
    return;
  }

  // 2. Buscar pedidos activos para ese cliente (hoy)
  const hoy = new Date().toISOString().slice(0, 10);
  const dp = await apiGet('/apipedido/lista?clienteId=' + cliente.id + '&desde=' + hoy + '&hasta=' + hoy + '&estatus=Activo&porPagina=5&paginaActual=1');
  const pedidos = dp.pedidos || [];

  if (!pedidos.length) {
    setStatus('Sin pedido', 'status-vacio');
    mostrarVacio('Sin pedido activo', 'No hay ningún pedido abierto para esta mesa hoy.\nLlama al mesero para que tome tu orden.');
    return;
  }

  // Tomar el pedido más reciente
  const pedido = pedidos[0];
  pedidoActual = pedido;

  // 3. Cargar detalle
  const dd = await apiGet('/apipedido/info?pedidoId=' + pedido.id);
  renderPedido(pedido, dd);
}

// ── RENDER ────────────────────────────────────────────────────
function renderPedido(pedido, detalle) {
  setStatus('Pedido activo', 'status-activo');

  const lineas = detalle.detalle || [];
  const subtotal  = parseFloat(pedido.subTotal || 0);
  const descuento = parseFloat(pedido.descuento || 0);
  const impuesto  = parseFloat(pedido.impuesto || 0);
  const total     = parseFloat(pedido.total || 0);

  const itemsHtml = lineas.map(l => {
    const cant  = parseFloat(l.cantidad || 0);
    const precio = parseFloat(l.precio || 0);
    const sub   = cant * precio * (1 - parseFloat(l.descuento || 0) / 100);
    return `<div class="line-item">
      <div class="line-qty">${cant % 1 === 0 ? cant : cant.toFixed(2)}</div>
      <div class="line-desc">
        <div class="line-name">${l.descripcion || '—'}</div>
        <div class="line-code">${l.codigoArticulo || ''}</div>
      </div>
      <div class="line-price">${fmtMoney(sub)}</div>
    </div>`;
  }).join('');

  const switchPayUrl = pedido.urlswitchpay || detalle.pedido?.urlswitchpay || '';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="pedido-card">
      <div class="pedido-header">
        <div class="pedido-num">Pedido #${pedido.secuencial || pedido.id}</div>
        <div class="pedido-fecha">${pedido.fecha || ''}</div>
      </div>
      ${itemsHtml || '<div style="padding:1.5rem;text-align:center;color:var(--muted);font-size:13px;">Sin artículos</div>'}
    </div>

    <div class="totals">
      ${descuento > 0 ? `<div class="total-row"><span>Descuento</span><span>-${fmtMoney(descuento)}</span></div>` : ''}
      ${impuesto  > 0 ? `<div class="total-row"><span>Impuesto</span><span>${fmtMoney(impuesto)}</span></div>` : ''}
      <div class="total-row grand"><span>Total</span><span>${fmtMoney(total)}</span></div>
    </div>

    <div class="actions">
      ${switchPayUrl
        ? `<button class="btn-pay btn-switchpay" onclick="pagarSwitchPay('${switchPayUrl}')">
            <span>💳</span> Pagar con Switch Pay
           </button>`
        : `<button class="btn-pay btn-switchpay" onclick="enviarSwitchPay()">
            <span>💳</span> Pagar con Switch Pay
           </button>`
      }
      <button class="btn-pay btn-mesero" onclick="llamarMesero()">
        <span>🙋</span> Pagar con el mesero
      </button>
    </div>

    <div style="text-align:center;">
      <button class="refresh-btn" onclick="recargar()">↻ Actualizar pedido</button>
    </div>
  `;
}

function mostrarVacio(titulo, sub) {
  document.getElementById('main').innerHTML = `
    <div class="state-box">
      <div class="state-icon">🍽️</div>
      <div class="state-title">${titulo}</div>
      <div class="state-sub">${sub}</div>
    </div>
    <div style="text-align:center;margin-top:1rem;">
      <button class="refresh-btn" onclick="recargar()">↻ Actualizar</button>
    </div>`;
}

function mostrarError(msg) {
  setStatus('Error', 'status-vacio');
  document.getElementById('main').innerHTML = `
    <div class="state-box">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Error de conexión</div>
      <div class="state-sub">${msg}</div>
    </div>
    <div style="text-align:center;margin-top:1rem;">
      <button class="refresh-btn" onclick="recargar()">↻ Reintentar</button>
    </div>`;
}

function setStatus(txt, cls) {
  const el = document.getElementById('header-status');
  el.textContent = txt;
  el.className = 'header-status ' + cls;
}

// ── PAGOS ─────────────────────────────────────────────────────
function pagarSwitchPay(url) {
  window.open(url, '_blank');
}

async function enviarSwitchPay() {
  if (!pedidoActual) return;
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Enviando link...';
  try {
    // Enviar link de pago por correo al cliente
    const fd = new FormData();
    fd.append('id', pedidoActual.id);
    fd.append('email', pedidoActual.clienteEmail || '');
    const r = await fetch(API_URL + '/apicobranzapedido/switchpay', {
      method: 'POST',
      headers: { 'Authorization': TOKEN },
      body: fd
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error.message);

    // Si tenemos URL directa, abrirla
    if (pedidoActual.urlswitchpay) {
      window.open(pedidoActual.urlswitchpay, '_blank');
    } else {
      mostrarExito('Link de pago enviado', 'Revisa el correo electrónico para completar el pago.');
    }
  } catch(e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '💳 Pagar con Switch Pay';
  }
}

function llamarMesero() {
  showModal(
    '🙋 Llamando al mesero',
    'El mesero se acercará en un momento para procesar tu pago en efectivo o tarjeta.',
    [
      { label: 'Entendido', cls: 'btn-switchpay', action: closeModal }
    ]
  );
}

function mostrarExito(titulo, sub) {
  const main = document.getElementById('main');
  const banner = `<div class="success-banner">
    <div class="success-icon">✅</div>
    <div class="success-title">${titulo}</div>
    <div class="success-sub">${sub}</div>
  </div>`;
  main.insertAdjacentHTML('afterbegin', banner);
}

// ── MODAL ─────────────────────────────────────────────────────
function showModal(title, sub, btns) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  const btnsHtml = btns.map(b =>
    `<button class="btn-pay ${b.cls}" onclick="(${b.action.toString()})()">${b.label}</button>`
  ).join('');
  overlay.innerHTML = `<div class="modal">
    <div class="modal-title">${title}</div>
    <div class="modal-sub">${sub}</div>
    <div class="modal-btns">${btnsHtml}</div>
  </div>`;
  document.body.appendChild(overlay);
}

function closeModal() {
  const el = document.getElementById('modal-overlay');
  if (el) el.remove();
}

// ── REFRESH ───────────────────────────────────────────────────
async function recargar() {
  document.getElementById('main').innerHTML = `<div class="state-box"><div class="spinner"></div><div class="state-title">Actualizando...</div></div>`;
  setStatus('•••', 'status-loading');
  try {
    if (!TOKEN) await login();
    await cargarPedido();
  } catch(e) {
    mostrarError(e.message);
  }
}

// Auto-refresh cada 30 segundos
setInterval(() => {
  if (document.visibilityState === 'visible') recargar();
}, 30000);
</script>

</body>
</html>
