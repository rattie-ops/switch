<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mi pedido</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" href="https://bt-cdn.yappy.cloud/v1/cdn/web-component-btn-yappy.js" as="script" crossorigin>
<script type="module" src="https://bt-cdn.yappy.cloud/v1/cdn/web-component-btn-yappy.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd6;
    --accent: #2d5a27;
    --green: #2d5a27;
    --yellow: #c8973a;
    --red: #b94040;
    --text: #1c1c1c;
    --muted: #6b6560;
    --dim: #c0b9b0;
    --font: Inter, system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    font-size: 15px;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 3px solid var(--accent);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left { display: flex; flex-direction: row; align-items: center; gap: 10px; }

  .header-brand {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .header-mesa {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .header-status {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
  }

  .status-activo   { background: #e6f7ef; color: #0e6e3a; }
  .status-vacio    { background: #fff8e6; color: #b87a00; }
  .status-loading  { background: #f0f1f3; color: var(--muted); }

  /* MAIN */
  .main { padding: 1.25rem; max-width: 520px; margin: 0 auto; }

  /* PEDIDO CARD */
  .pedido-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 1rem;
  }

  .pedido-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .pedido-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .pedido-fecha {
    font-size: 12px;
    color: var(--muted);
  }

  /* LINE ITEMS */
  .line-item {
    display: flex;
    align-items: center;
    padding: 0.9rem 1.25rem;
    border-bottom: 1px solid var(--border);
    gap: 1rem;
  }

  .line-item:last-child { border-bottom: none; }

  .line-qty {
    min-width: 36px;
    height: 36px;
    background: var(--surface2);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    font-family: var(--mono);
  }

  .line-desc {
    flex: 1;
  }

  .line-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }

  .line-code {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 2px;
  }

  .line-price {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    font-family: var(--mono);
    white-space: nowrap;
  }

  /* TOTALS */
  .totals {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    font-size: 14px;
    color: var(--muted);
  }

  .total-row.grand {
    border-top: 1px solid var(--border);
    margin-top: 6px;
    padding-top: 10px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .total-row.grand span:last-child { color: var(--accent); }

  /* ACTIONS */
  .actions { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }

  .btn-pay {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-pay:active { transform: scale(0.98); }
  .btn-pay:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-switchpay {
    background: var(--accent);
    color: #fff;
    letter-spacing: 0.3px;
  }

  .btn-mesero {
    background: var(--surface);
    color: var(--text);
    border: 1.5px solid var(--border);
  }

  .btn-mesero:hover { border-color: var(--accent); }

  .btn-yappy { background: #00C244; color: #fff; }
  .tel-wrap { display:flex; align-items:center; background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; overflow:hidden; }
  .tel-prefix { padding:12px 14px; font-size:15px; color:var(--muted); border-right:1px solid var(--border); white-space:nowrap; }
  .tel-input { flex:1; background:none; border:none; padding:12px 14px; font-size:16px; font-family:var(--font); color:var(--text); outline:none; }
  .total-preview { background:var(--surface2); border-radius:8px; padding:10px 14px; display:flex; justify-content:space-between; font-size:14px; }

  /* EMPTY / LOADING / ERROR */
  .state-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3rem 1.5rem;
    text-align: center;
    color: var(--muted);
  }

  .state-icon { font-size: 40px; margin-bottom: 0.75rem; }
  .state-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .state-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }

  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--dim);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* CONFIRM MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 1rem;
  }

  .modal {
    background: var(--surface);
    border-radius: 16px 16px 12px 12px;
    width: 100%;
    max-width: 480px;
    padding: 1.5rem;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .modal-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 1.25rem;
    line-height: 1.5;
  }

  .modal-btns { display: flex; flex-direction: column; gap: 0.5rem; }

  /* SUCCESS */
  .success-banner {
    background: #e6f7ef;
    border: 1px solid #a3d9bc;
    border-radius: var(--radius);
    padding: 1.25rem;
    text-align: center;
    margin-bottom: 1rem;
  }

  .success-icon { font-size: 36px; margin-bottom: 0.5rem; }
  .success-title { font-size: 16px; font-weight: 700; color: #0e6e3a; margin-bottom: 0.25rem; }
  .success-sub { font-size: 13px; color: #1DA760; }

  /* REFRESH */
  .refresh-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: underline;
  }

  @media print {
    body * { visibility: hidden; }
    #qr-section, #qr-section * { visibility: visible; }
    #qr-section { position: fixed; top: 0; left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="https://d2j6dbq0eux0bg.cloudfront.net/images/39799274/1841556878.jpg" alt="Mamba by Diana" style="height:38px; width:auto; border-radius:6px; object-fit:cover;" />
    <div class="header-mesa" id="header-mesa">Cargando...</div>
  </div>
  <div class="header-status status-loading" id="header-status">•••</div>
</div>

<div class="main" id="main">
  <div class="state-box">
    <div class="spinner"></div>
    <div class="state-title">Buscando tu pedido...</div>
  </div>
</div>

<script>
const API_URL  = 'https://mambabydiana.switch-soft.com';
const API_USER = 'admin';
const API_PASS = 'Mamba2020';

// Leer número de mesa desde ?mesa=1
const params     = new URLSearchParams(location.search);
const mesaNum    = params.get('mesa') || '1';
const mesaCodigo = mesaNum.padStart(3, '0');  // "1" → "001"

let TOKEN        = null;
let pedidoActual = null;

document.getElementById('header-mesa').textContent = 'Mesa ' + mesaNum;
document.title = 'Mesa ' + mesaNum + ' — Mi pedido';

// ── AUTENTICACIÓN ─────────────────────────────────────────────
async function obtenerToken() {
  // Usar token cacheado si existe
  const cached = sessionStorage.getItem('sw_token');
  if (cached) { TOKEN = cached; return; }

  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('usuario', API_USER);
    fd.append('password', API_PASS);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', API_URL + '/autenticacion');
    xhr.onload = () => {
      try {
        const data = JSON.parse(xhr.responseText);
        if (data.error) return reject(new Error('Auth: ' + data.error.message));
        TOKEN = data.data.token;
        sessionStorage.setItem('sw_token', TOKEN);
        resolve();
      } catch(e) { reject(e); }
    };
    xhr.onerror = () => reject(new Error('No se pudo conectar al servidor'));
    xhr.send(fd);
  });
}

// ── INIT ──────────────────────────────────────────────────────
async function init() {
  try {
    await obtenerToken();
    const pago = params.get('pago');
    if (pago === 'ok') {
      await cargarPedido();
      await facturarPedido();
    } else if (pago === 'fail') {
      await cargarPedido();
      mostrarError('El pago no fue completado. Intenta de nuevo o paga en caja.');
    } else {
      await cargarPedido();
    }
  } catch(e) {
    mostrarError(e.message);
  }
}

init();

// ── API GET ───────────────────────────────────────────────────
async function apiGet(path) {
  const r = await fetch(API_URL + path, { headers: { 'Authorization': TOKEN } });
  const data = await r.json();
  if (data.error) {
    if (data.error.code == '0005' && data.new_token) {
      TOKEN = data.new_token;
      sessionStorage.setItem('sw_token', TOKEN);
      return apiGet(path);
    }
    if (data.error.code == '0006') {
      sessionStorage.removeItem('sw_token');
      await obtenerToken();
      return apiGet(path);
    }
    throw new Error(data.error.message);
  }
  return data.data;
}

function fmtMoney(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return '—';
  return '$' + n.toLocaleString('es-PA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── MAPA DE MESAS → clienteId ─────────────────────────────────
const MESA_IDS = {
  '1': 105, '2': 2062, '3': 2063, '4': 2079,
  '5': 2080, '6': 2081, '7': 2082
};

// ── BUSCAR PEDIDO ─────────────────────────────────────────────
async function cargarPedido() {
  const clienteId = MESA_IDS[mesaNum];
  if (!clienteId) {
    mostrarVacio('Mesa no configurada', 'La mesa ' + mesaNum + ' no está configurada.');
    return;
  }

  const dp = await apiGet('/apipedido/lista?clienteId=' + clienteId + '&porPagina=1&paginaActual=1');
  const pedidos = dp.pedidos || [];

  if (!pedidos.length) {
    setStatus('Sin pedido', 'status-vacio');
    mostrarVacio('Sin pedido activo', 'No hay ningún pedido abierto para esta mesa.\nAcércate a la caja para realizar tu orden.');
    return;
  }

  const pedido = pedidos[0];
  pedidoActual = pedido;

  // Cargar detalle en paralelo con nada — listo para futuras optimizaciones
  const dd = await apiGet('/apipedido/info?pedidoId=' + pedido.id);
  renderPedido(pedido, dd);
}

// ── RENDER ────────────────────────────────────────────────────
function renderPedido(pedido, detalle) {
  setStatus('Pedido activo', 'status-activo');

  const lineas    = detalle.detalle || [];
  const subtotal  = parseFloat(pedido.subTotal  || 0);
  const descuento = parseFloat(pedido.descuento || 0);
  const impuesto  = parseFloat(pedido.impuesto  || 0);
  const total     = parseFloat(pedido.total     || 0);

  const itemsHtml = lineas.map(l => {
    const cant   = parseFloat(l.cantidad || 0);
    const precio = parseFloat(l.precio   || 0);
    const sub    = cant * precio * (1 - parseFloat(l.descuento || 0) / 100);
    return `<div class="line-item">
      <div class="line-qty">${cant % 1 === 0 ? cant : cant.toFixed(2)}</div>
      <div class="line-desc">
        <div class="line-name">${l.descripcion || '—'}</div>
        <div class="line-code">${l.codigoArticulo || ''}</div>
      </div>
      <div class="line-price">${fmtMoney(sub)}</div>
    </div>`;
  }).join('');

  const switchPayUrl = pedido.urlswitchpay || detalle.pedido?.urlswitchpay || '';

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="pedido-card">
      <div class="pedido-header">
        <div class="pedido-num">Pedido #${pedido.secuencial || pedido.id}</div>
        <div class="pedido-fecha">${pedido.fecha || ''}</div>
      </div>
      ${itemsHtml || '<div style="padding:1.5rem;text-align:center;color:var(--muted);font-size:13px;">Sin artículos</div>'}
    </div>

    <div class="totals">
      ${descuento > 0 ? `<div class="total-row"><span>Descuento</span><span>-${fmtMoney(descuento)}</span></div>` : ''}
      ${impuesto  > 0 ? `<div class="total-row"><span>Impuesto</span><span>${fmtMoney(impuesto)}</span></div>`  : ''}
      <div class="total-row grand"><span>Total</span><span>${fmtMoney(total)}</span></div>
    </div>

      <div class="actions">
        <div id="yappy-btn-wrap" style="width:100%; display:flex; justify-content:center; min-height:50px;">
          <div style="width:100%; height:48px; background:#00C244; border-radius:10px; display:flex; align-items:center; justify-content:center; opacity:0.3;">
            <span style="color:#fff; font-size:14px; font-weight:600;">Cargando Yappy...</span>
          </div>
        </div>
        <button class="btn-pay btn-mesero" onclick="pagarEnCaja()">
          <span>🏪</span> Pagar en caja
        </button>
      </div>
      <div style="text-align:center;">
        <button class="refresh-btn" onclick="recargar()">↻ Actualizar pedido</button>
      </div>
    `;
  window._yappyData = {
    merchantId: '7d9be35b-2c61-4afb-a3be-afe549b1de5f',
    urlDomain:  'https://mesas.mambabydiana.com',
    orderId:    String(pedido.id),
    total:      total.toFixed(2),
    subtotal:   (total - impuesto).toFixed(2),
    taxes:      impuesto.toFixed(2),
    mesa:       mesaNum,
    totalFmt:   fmtMoney(total)
  };

  // Inyectar botón oficial de Yappy
  const yappyWrap = document.getElementById('yappy-btn-wrap');
  if (yappyWrap) {
    yappyWrap.innerHTML = '';
    const btnYappy = document.createElement('btn-yappy');
    btnYappy.setAttribute('merchant-id', '7d9be35b-2c61-4afb-a3be-afe549b1de5f');
    btnYappy.setAttribute('url-domain',  'https://mesas.mambabydiana.com');
    btnYappy.setAttribute('order-id',    String(pedido.id));
    btnYappy.setAttribute('total',       total.toFixed(2));
    btnYappy.setAttribute('subtotal',    (total - impuesto).toFixed(2));
    btnYappy.setAttribute('taxes',       impuesto.toFixed(2));
    btnYappy.setAttribute('shipping',    '0.00');
    btnYappy.setAttribute('discount',    '0.00');
    btnYappy.setAttribute('success-url', `https://mesas.mambabydiana.com/mesa.html?mesa=${mesaNum}&pago=ok`);
    btnYappy.setAttribute('fail-url',    `https://mesas.mambabydiana.com/mesa.html?mesa=${mesaNum}&pago=fail`);
    btnYappy.setAttribute('color',       'brand');
    btnYappy.style.width = '100%';
    btnYappy.addEventListener('eventClick', (e) => {
      e.preventDefault();
      e.stopPropagation();
      abrirModalYappy();
    });
    yappyWrap.appendChild(btnYappy);
  }
}

function mostrarVacio(titulo, sub) {
  document.getElementById('main').innerHTML = `
    <div class="state-box">
      <div class="state-icon">🍽️</div>
      <div class="state-title">${titulo}</div>
      <div class="state-sub">${sub}</div>
    </div>
    <div style="text-align:center;margin-top:1rem;">
      <button class="refresh-btn" onclick="recargar()">↻ Actualizar</button>
    </div>`;
}

function mostrarError(msg) {
  setStatus('Error', 'status-vacio');
  document.getElementById('main').innerHTML = `
    <div class="state-box">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Error de conexión</div>
      <div class="state-sub">${msg}</div>
    </div>
    <div style="text-align:center;margin-top:1rem;">
      <button class="refresh-btn" onclick="recargar()">↻ Reintentar</button>
    </div>`;
}

function setStatus(txt, cls) {
  const el = document.getElementById('header-status');
  el.textContent = txt;
  el.className = 'header-status ' + cls;
}

// ── PAGOS ─────────────────────────────────────────────────────
function pagarSwitchPay(url) {
  window.open(url, '_blank');
}

async function enviarSwitchPay() {
  if (!pedidoActual) return;
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Enviando link...';
  try {
    const fd = new FormData();
    fd.append('id', pedidoActual.id);
    fd.append('email', pedidoActual.clienteEmail || '');
    const r = await fetch(API_URL + '/apicobranzapedido/switchpay', {
      method: 'POST',
      headers: { 'Authorization': TOKEN },
      body: fd
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error.message);

    if (pedidoActual.urlswitchpay) {
      window.open(pedidoActual.urlswitchpay, '_blank');
    } else {
      mostrarExito('Link de pago enviado', 'Revisa el correo electrónico para completar el pago.');
    }
  } catch(e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '💳 Pagar con Switch Pay';
  }
}

// ── YAPPY ─────────────────────────────────────────────────────
// ── FACTURAR ──────────────────────────────────────────────────
async function facturarPedido() {
  if (!pedidoActual) return;

  try {
    // Cargar detalle del pedido para obtener artículos
    const dd = await apiGet('/apipedido/info?pedidoId=' + pedidoActual.id);
    const lineas = dd.detalle || [];

    const articulos = lineas.map(l => ({
      codigoBarraId: String(l.codigoBarraId),
      cantidad:      parseFloat(l.cantidad).toFixed(4),
      precio:        parseFloat(l.precio).toFixed(2),
      descuento:     parseFloat(l.descuento || 0).toFixed(2)
    }));

    const fd = new FormData();
    fd.append('vendedorId',    '1');
    fd.append('clienteId',     String(MESA_IDS[mesaNum]));
    fd.append('comprobante',   'PEDIDO');
    fd.append('comprobanteId', String(pedidoActual.id));
    fd.append('articulos',     JSON.stringify(articulos));
    fd.append('formasPago',    JSON.stringify([{
      formaPagoId: '16',
      valor:       parseFloat(pedidoActual.total).toFixed(2)
    }]));

    const r = await fetch(API_URL + '/apifactura/terminar', {
      method: 'POST',
      headers: { 'Authorization': TOKEN },
      body: fd
    });
    const data = await r.json();
    alert('Switch factura response: ' + JSON.stringify(data));
    if (data.error) throw new Error(data.error.message);

    mostrarExito(
      '✅ ¡Pago completado!',
      'Factura #' + (data.data.numeroInterno || '') + ' generada. ¡Gracias por tu compra!'
    );

  } catch(e) {
    alert('Error facturando: ' + e.message);
    mostrarExito('✅ ¡Pago recibido!', 'Tu pago con Yappy fue procesado. ¡Gracias!');
  }
}

function abrirModalYappy() {
  if (!window._yappyData) return;
  const { totalFmt } = window._yappyData;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">💚 Pagar con Yappy</div>
      <div class="modal-sub">Ingresa tu número de celular. Recibirás una notificación en tu app Yappy para aprobar el pago.</div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div class="tel-wrap">
          <span class="tel-prefix">🇵🇦 +507</span>
          <input type="tel" id="yappy-tel" class="tel-input" placeholder="6000-0000" maxlength="9"
            onkeydown="if(event.key==='Enter') procesarPagoYappy()" />
        </div>
        <div class="total-preview">
          <span style="color:var(--muted)">Total a pagar</span>
          <span style="font-weight:700; color:var(--accent)">${totalFmt}</span>
        </div>
        <button class="btn-pay btn-yappy" id="btn-yappy-confirmar" onclick="procesarPagoYappy()">
          Enviar solicitud de pago
        </button>
        <button class="btn-pay btn-mesero" onclick="closeModal()">Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('yappy-tel')?.focus(), 150);
}

async function procesarPagoYappy() {
  const tel = document.getElementById('yappy-tel')?.value.replace(/\D/g, '');
  if (!tel || tel.length < 7) { alert('Ingresa un número válido'); return; }

  const btn = document.getElementById('btn-yappy-confirmar');
  btn.disabled = true;
  btn.textContent = 'Procesando...';

  const d = window._yappyData;

  try {
    // Paso 1: Validar comercio y obtener token
    const authResp = await fetch('https://apipagosbg.bgeneral.cloud/payments/validate/merchant', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ merchantId: d.merchantId, urlDomain: d.urlDomain })
    });
    const authData = await authResp.json();
    if (!authResp.ok || authData.status?.code !== '0000') throw new Error('Auth: ' + JSON.stringify(authData));
    const token = authData.body.token;

    // Paso 2: Crear orden
    const orderResp = await fetch('https://apipagosbg.bgeneral.cloud/payments/payment-wc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': token },
      body: JSON.stringify({
        merchantId:  d.merchantId,
        orderId:     d.orderId.substring(0, 15),
        domain:      d.urlDomain,
        paymentDate: Date.now(),
        aliasYappy:  tel,
        ipnUrl:      `${d.urlDomain}/mesa.html?mesa=${d.mesa}&pago=ok`,
        discount:    '0.00',
        taxes:       d.taxes,
        subtotal:    d.subtotal,
        total:       d.total
      })
    });
    const orderData = await orderResp.json();
    if (!orderResp.ok || orderData.status?.code !== '0000') throw new Error('Orden: ' + JSON.stringify(orderData));

    closeModal();

    // Mostrar pantalla de espera con botón "Ya aprobé"
    const main = document.getElementById('main');
    main.insertAdjacentHTML('afterbegin', `
      <div id="esperando-yappy" style="background:#e6f7ef; border:1px solid #a3d9bc; border-radius:12px; padding:1.25rem; text-align:center; margin-bottom:1rem;">
        <div style="font-size:36px; margin-bottom:0.5rem;">🌿</div>
        <div style="font-size:16px; font-weight:700; color:#0e6e3a; margin-bottom:0.25rem;">Solicitud enviada a Yappy</div>
        <div style="font-size:13px; color:#1DA760; margin-bottom:1rem;">Abre tu app Yappy y aprueba el pago de ${fmtMoney(d.total)}</div>
        <button onclick="confirmarPagoYappy()" style="max-width:300px; margin:0 auto; width:100%; padding:14px; border:none; border-radius:10px; background:#00C244; color:#fff; font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
          <img src="https://bt-cdn.yappy.cloud/v1/cdn/assets/yappy-icon-white.svg" style="height:22px;" onerror="this.style.display='none'"> Ya aprobé el pago
        </button>
      </div>
    `);

  } catch(e) {
    alert('Error Yappy: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Enviar solicitud de pago';
  }
}

async function confirmarPagoYappy() {
  const btn = document.querySelector('#esperando-yappy button');
  if (btn) { btn.disabled = true; btn.textContent = 'Procesando...'; }
  try {
    await facturarPedido();
    const el = document.getElementById('esperando-yappy');
    if (el) el.remove();
  } catch(e) {
    if (btn) { btn.disabled = false; btn.innerHTML = '<img src="https://bt-cdn.yappy.cloud/v1/cdn/assets/yappy-icon-white.svg" style="height:22px;" onerror="this.style.display=\'none\'"> Ya aprobé el pago'; }
    alert('Error: ' + e.message);
  }
}

function pagarEnCaja() {
  showModal(
    '🏪 Pagar en caja',
    'Dirígete a la caja para realizar tu pago en efectivo o tarjeta.',
    [{ label: 'Entendido', cls: 'btn-switchpay', action: closeModal }]
  );
}

function mostrarExito(titulo, sub) {
  const banner = `<div class="success-banner">
    <div class="success-icon">✅</div>
    <div class="success-title">${titulo}</div>
    <div class="success-sub">${sub}</div>
  </div>`;
  document.getElementById('main').insertAdjacentHTML('afterbegin', banner);
}

// ── MODAL ─────────────────────────────────────────────────────
function showModal(title, sub, btns) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  const btnsHtml = btns.map(b =>
    `<button class="btn-pay ${b.cls}" onclick="(${b.action.toString()})()">${b.label}</button>`
  ).join('');
  overlay.innerHTML = `<div class="modal">
    <div class="modal-title">${title}</div>
    <div class="modal-sub">${sub}</div>
    <div class="modal-btns">${btnsHtml}</div>
  </div>`;
  document.body.appendChild(overlay);
}

function closeModal() {
  const el = document.getElementById('modal-overlay');
  if (el) el.remove();
}

// ── YAPPY ─────────────────────────────────────────────────────
async function recargar() {
  document.getElementById('main').innerHTML = `<div class="state-box"><div class="spinner"></div><div class="state-title">Actualizando...</div></div>`;
  setStatus('•••', 'status-loading');
  try {
    if (!TOKEN) await obtenerToken();
    await cargarPedido();
  } catch(e) {
    mostrarError(e.message);
  }
}


</script>
